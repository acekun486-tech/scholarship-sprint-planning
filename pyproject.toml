[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 保证 pytest 控制台脚本与 python -m pytest 都能导入仓库根目录的 app.py / database.py
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "reports", "htmlcov", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "PLR"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 测试代码需要 assert 和固定演示口令；生产代码继续启用对应安全规则。
"tests/*.py" = ["S101", "S105", "S106", "S107", "PLR2004"]
