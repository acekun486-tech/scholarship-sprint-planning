name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff static scan
        run: ruff check .

      - name: Bandit security scan
        run: bandit -r app.py database.py -ll

      - name: Tests and coverage
        run: |
          python -m pytest -q --cov --cov-report=term-missing \
            --cov-report=xml --cov-report=html --cov-fail-under=80
          python -m coverage report --include="app.py" --fail-under=80
          python -m coverage report --include="database.py" --fail-under=80

      - name: Incremental coverage (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=60

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: error
